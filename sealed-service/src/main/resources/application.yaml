server:
  port: 8081

spring:
  application:
    name: sealed
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/sealed_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
